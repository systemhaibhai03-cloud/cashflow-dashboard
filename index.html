<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cash Flow Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">₹</div>
      <div>
        <h1>Cash Flow Dashboard</h1>
        <p class="sub" id="updatedAt">Loading…</p>
      </div>
    </div>
    <button class="refresh-btn" id="refreshBtn">
      <span class="spin-icon">⟳</span> Refresh data
    </button>
  </header>

  <!-- ============ CONTROLS ============ -->
  <section class="controls">
    <div class="seg" id="companySeg">
      <button class="seg-btn active" data-company="BOTH">Both</button>
      <button class="seg-btn" data-company="VE">Vishal Electricals</button>
      <button class="seg-btn" data-company="VTPL">Vishal Technopower</button>
    </div>

    <div class="seg" id="periodSeg">
      <button class="seg-btn active" data-period="monthly">Monthly</button>
      <button class="seg-btn" data-period="weekly">Weekly</button>
    </div>

    <label class="field">
      <span>Month</span>
      <select id="monthSelect"></select>
    </label>

    <label class="field" id="weekField" style="display:none">
      <span>Week</span>
      <select id="weekSelect">
        <option value="ALL">All weeks</option>
        <option value="1">Week 1 (1–7)</option>
        <option value="2">Week 2 (8–14)</option>
        <option value="3">Week 3 (15–21)</option>
        <option value="4">Week 4 (22–end)</option>
      </select>
    </label>

    <label class="toggle" id="interToggle">
      <input type="checkbox" id="interCheck" />
      <span>Include inter-company transfers</span>
    </label>
  </section>

  <!-- ============ MAIN ============ -->
  <main id="main">
    <div class="loading" id="loadingBox">
      <div class="loader"></div>
      <p>Fetching your Google Sheet…</p>
    </div>

    <div id="errorBox" class="errorbox" style="display:none"></div>

    <div id="content" style="display:none"></div>
  </main>

  <!-- ============ DETAIL MODAL ============ -->
  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Details</h3>
        <button class="close-btn" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>

  <!-- ================================================================= -->
  <!--  PAGE AGENT + VOICE                                                -->
  <!--  AHEM: ye sab DASHBOARD KA DATA AANE KE BAAD init hota hai, taaki  -->
  <!--  initial Google-Sheet fetch ke beech agent dakhal na de (warna     -->
  <!--  spinner atak jaata tha). Library: alibaba/page-agent (MIT).       -->
  <!-- ================================================================= -->
  <style>
    /* ===== AI Agent Avatar ===== */
    #voiceBtn{position:fixed;left:18px;bottom:18px;z-index:2147483000;width:64px;height:64px;padding:0;
      border:none;border-radius:50%;cursor:pointer;overflow:visible;color:#fff;
      background:radial-gradient(circle at 33% 27%,#6ea0ff,#2563eb 58%,#1e40af);
      box-shadow:0 8px 22px rgba(37,99,235,.5),inset 0 -3px 8px rgba(0,0,0,.18),inset 0 3px 8px rgba(255,255,255,.28);
      display:flex;align-items:center;justify-content:center;animation:aiFloat 3.6s ease-in-out infinite;
      transition:transform .15s,background .25s,box-shadow .25s}
    #voiceBtn:active{transform:scale(.93)}
    @keyframes aiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    #voiceBtn .ai-rings{position:absolute;inset:0;border-radius:50%;pointer-events:none}
    #voiceBtn .ai-rings span{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0}
    #voiceBtn.listening .ai-rings span{border-color:#fecaca;animation:aiRing 1.5s ease-out infinite}
    #voiceBtn.listening .ai-rings span:nth-child(2){animation-delay:.55s}
    @keyframes aiRing{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.2);opacity:0}}
    #voiceBtn .ai-face{width:42px;height:42px;display:block}
    #voiceBtn .ai-eye{fill:#fff;transform-box:fill-box;transform-origin:center;animation:aiBlink 4.6s infinite}
    #voiceBtn .ai-eye.r{animation-delay:.06s}
    @keyframes aiBlink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    #voiceBtn .ai-bar{fill:#fff;transform-box:fill-box;transform-origin:center}
    #voiceBtn.listening{background:radial-gradient(circle at 33% 27%,#fca5a5,#ef4444 58%,#b91c1c);
      box-shadow:0 8px 22px rgba(239,68,68,.5)}
    #voiceBtn.processing{background:radial-gradient(circle at 33% 27%,#fcd34d,#f59e0b 58%,#b45309);
      box-shadow:0 8px 22px rgba(245,158,11,.5);animation:aiSpin 1.1s linear infinite}
    @keyframes aiSpin{to{transform:rotate(360deg)}}
    #voiceBtn.processing .ai-face{animation:aiSpinBack 1.1s linear infinite}
    @keyframes aiSpinBack{to{transform:rotate(-360deg)}}
    #voiceBtn.speaking{background:radial-gradient(circle at 33% 27%,#6ee7b7,#059669 58%,#047857);
      box-shadow:0 8px 22px rgba(5,150,105,.5);animation:none}
    #voiceBtn.speaking .ai-bar{animation:aiWave .55s ease-in-out infinite}
    #voiceBtn.speaking .ai-bar:nth-child(4){animation-delay:.12s}
    #voiceBtn.speaking .ai-bar:nth-child(5){animation-delay:.26s}
    #voiceBtn.speaking .ai-bar:nth-child(6){animation-delay:.06s}
    @keyframes aiWave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(2.6)}}
    #voiceHint{position:fixed;left:18px;bottom:86px;z-index:2147483000;max-width:74vw;background:#111;
      color:#fff;padding:8px 12px;border-radius:10px;font:13px/1.4 system-ui,sans-serif;display:none;
      box-shadow:0 4px 14px rgba(0,0,0,.3)}
    #gearBtn{position:fixed;left:92px;bottom:24px;z-index:2147483000;width:44px;height:44px;border:none;
      border-radius:50%;cursor:pointer;background:#475569;color:#fff;font-size:18px;box-shadow:0 3px 12px rgba(0,0,0,.3)}
    #elModal{position:fixed;inset:0;z-index:2147483600;background:rgba(0,0,0,.55);display:none;
      align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif}
    #elModal .box{background:#0f172a;color:#e2e8f0;max-width:420px;width:100%;border-radius:16px;padding:20px}
    #elModal h3{margin:0 0 6px;font-size:17px} #elModal p{margin:0 0 14px;font-size:12px;color:#94a3b8}
    #elModal label{display:block;font-size:13px;margin:10px 0 4px;color:#cbd5e1}
    #elModal input{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #334155;
      background:#1e293b;color:#fff;font-size:14px}
    #elModal .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    #elModal button{flex:1;min-width:90px;padding:11px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
    .b-save{background:#2563eb;color:#fff} .b-test{background:#16a34a;color:#fff}
    .b-clear{background:#7f1d1d;color:#fff} .b-close{background:#334155;color:#fff}
  </style>
  <script>
  (function(){
    /* =============== CONFIG (sirf yahan badalna padega) =============== */
    const PA_CONFIG = {
      mode: 'demo',                       // 'demo' (free LLM) ya 'custom' (apna proxy)
      demo:   { model:'qwen3.5-plus', baseURL:'https://page-ag-testing-ohftxirgbn.cn-shanghai.fcapp.run', apiKey:'NA' },
      custom: { model:'qwen3.5-plus', baseURL:'https://YOUR-PROXY.onrender.com/v1', apiKey:'' },
      language: 'en-US',
      maxSteps: 18,                       // kam steps = thoda fast (default 40 tha)
    };
    const VOICE_LANG    = 'en-IN';        // sunne ki bhasha. Pure Hindi: 'hi-IN'
    const BACKGROUND_MODE = true;         // true = chat panel hidden, sab background mein
    const SPEAK_OUTPUT    = true;         // true = jawab audio mein bhi bolega
    const SPEAK_LANG      = 'hi-IN';      // bolne ki bhasha (Hinglish ke liye hi-IN sahi). English: 'en-IN'

    const DASHBOARD_INSTRUCTIONS = `
You control the "Cash Flow Dashboard" of Vishal Electricals (VE) and Vishal Technopower (VTPL).
Work in the FEWEST possible actions. Be decisive, do not re-check the page unless needed.
Keep evaluation/memory/next_goal to a few words each (short, not verbose), then act.
Operate by clicking/selecting — set the right filters, then read the figures shown, then call done with a SHORT spoken answer (1-2 lines).
Controls: company buttons "Both"/"Vishal Electricals"(VE)/"Vishal Technopower"(VTPL);
"Monthly"/"Weekly" buttons (Weekly shows a Week dropdown: 1=1-7, 2=8-14, 3=15-21, 4=22-end);
"Month" dropdown; "Include inter-company transfers" checkbox; "Refresh data" button;
clicking a row opens a detail popup (close with ✕). Amounts are INR.
IMPORTANT — reply style: answer in simple HINGLISH (Hindi written in English letters), exactly how the user speaks. Keep it ONE short line and end politely.
Example: user "June outflow?" -> done text: "June mein 45 lakh ka outflow hai, dhanyawad."
Use short money words: "lakh", "crore". Do not give long explanations or English paragraphs.
`.trim();

    /* =============== 1) Data load hone ka wait =============== */
    function whenDashboardReady(cb){
      let done=false; const fire=()=>{ if(!done){done=true;cb();} };
      const ready=()=>{
        const c=document.getElementById('content'), l=document.getElementById('loadingBox');
        return (c && getComputedStyle(c).display!=='none') ||
               (l && getComputedStyle(l).display==='none');
      };
      if(ready()) return fire();
      const iv=setInterval(()=>{ if(ready()){clearInterval(iv);fire();} }, 500);
      setTimeout(()=>{ clearInterval(iv); fire(); }, 25000);   // safety: data error ho to bhi AI aaye
    }

    /* =============== 2) Agent script load + init (data ke baad) =============== */
    const VER='1.10.0', FILE='dist/iife/page-agent.demo.js?autoInit=false';
    const LOCAL = (location.protocol==='file:') ? 'page-agent.demo.js'
                                                : 'page-agent.demo.js?autoInit=false';
    const CDNS=[ LOCAL,
      'https://cdn.jsdelivr.net/npm/page-agent@'+VER+'/'+FILE,
      'https://unpkg.com/page-agent@'+VER+'/'+FILE,
      'https://registry.npmmirror.com/page-agent/'+VER+'/files/'+FILE ];

    let starting=false;
    function startAgent(){
      if(window.pageAgent || starting) return;
      starting=true;
      let i=0;
      (function next(){
        if(window.PageAgent) return finish();
        if(i>=CDNS.length){ console.error('[PageAgent] script load fail (network/CDN).'); starting=false; return; }
        const s=document.createElement('script'); s.src=CDNS[i++];
        s.onload =()=> window.PageAgent ? finish() : next();
        s.onerror=()=> next();
        document.head.appendChild(s);
      })();
      function finish(){
        const apply=()=>{
          try{ if(window.pageAgent && window.pageAgent.dispose) window.pageAgent.dispose(); }catch(e){}
          const c=PA_CONFIG[PA_CONFIG.mode];
          window.pageAgent=new window.PageAgent({
            model:c.model, baseURL:c.baseURL, apiKey:c.apiKey, maxSteps:PA_CONFIG.maxSteps,
            language:PA_CONFIG.language, instructions:{ system:DASHBOARD_INSTRUCTIONS }
          });
          if(BACKGROUND_MODE){
            // panel ko hamesha hidden rakho (woh status 'running' pe khud show hota hai, isliye show ko no-op)
            try{ window.pageAgent.panel.show=function(){}; window.pageAgent.panel.hide(); }catch(e){}
          } else {
            window.pageAgent.panel.show();
          }
          console.log('[PageAgent] ready ✓ (mode: '+PA_CONFIG.mode+', background: '+BACKGROUND_MODE+')');
        };
        (LOCAL.indexOf('autoInit=false')===-1) ? setTimeout(apply,120) : apply();
      }
    }

    /* =============== TTS — ElevenLabs (key ho to) warna browser voice =============== */
    const SILENT_WAV='data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAA';
    const ttsAudio=new Audio();
    let ttsPrimed=false, pickedVoice=null;
    const elKey  =()=>{ try{return localStorage.getItem('el_key')||'';}catch(e){return '';} };
    const elVoice=()=>{ try{return localStorage.getItem('el_voice')||'21m00Tcm4TlvDq8ikWAM';}catch(e){return '21m00Tcm4TlvDq8ikWAM';} };

    function pickVoice(){
      if(!window.speechSynthesis) return;
      const vs=window.speechSynthesis.getVoices()||[];
      pickedVoice = vs.find(v=>v.lang===SPEAK_LANG) || vs.find(v=>v.lang&&v.lang.indexOf('hi')===0)
                 || vs.find(v=>v.lang&&v.lang.indexOf('en-IN')===0) || vs.find(v=>v.lang&&v.lang.indexOf('en')===0) || vs[0] || null;
    }
    if(window.speechSynthesis){ pickVoice(); window.speechSynthesis.onvoiceschanged=pickVoice; }

    function primeTTS(){                                 // user-tap ke andar audio unlock (mobile)
      if(ttsPrimed) return; ttsPrimed=true;
      try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis&&window.speechSynthesis.speak(u); }catch(e){}
      try{ ttsAudio.src=SILENT_WAV; ttsAudio.play().then(()=>{ttsAudio.pause();}).catch(()=>{}); }catch(e){}
    }
    function speakBrowser(text){
      if(!window.speechSynthesis) return;
      try{ window.speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(String(text));
        if(pickedVoice){ u.voice=pickedVoice; u.lang=pickedVoice.lang; } else { u.lang=SPEAK_LANG; }
        u.rate=1.05; u.volume=1; window.speechSynthesis.resume(); window.speechSynthesis.speak(u);
      }catch(e){}
    }
    async function speakEL(text){
      const key=elKey(); if(!key) throw new Error('no key');
      const res=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+elVoice(),{
        method:'POST',
        headers:{ 'xi-api-key':key, 'Content-Type':'application/json', 'Accept':'audio/mpeg' },
        body:JSON.stringify({ text:String(text), model_id:'eleven_turbo_v2_5',
          voice_settings:{ stability:0.5, similarity_boost:0.75 } })
      });
      if(!res.ok){ throw new Error('ElevenLabs '+res.status+(res.status===401?' (key galat?)':res.status===429?' (free limit khatam?)':'')); }
      const blob=await res.blob();
      ttsAudio.src=URL.createObjectURL(blob);
      await ttsAudio.play();
    }
    function speak(text){
      if(!SPEAK_OUTPUT||!text) return;
      if(elKey()){ speakEL(text).catch(err=>{ console.warn('[TTS] ElevenLabs fail → browser voice:',err.message); speakBrowser(text); }); }
      else speakBrowser(text);
    }

    /* =============== Settings modal (ElevenLabs key — 1 time) =============== */
    function setupSettings(){
      const gear=document.createElement('button'); gear.id='gearBtn'; gear.textContent='⚙️'; gear.title='Voice settings';
      const m=document.createElement('div'); m.id='elModal';
      m.innerHTML=`<div class="box">
        <h3>🔊 Voice settings — ElevenLabs</h3>
        <p>Key sirf is browser mein save hoti hai (localStorage), public source mein nahi jaati. Khaali chhodo to free browser-voice chalegi.</p>
        <label>ElevenLabs API key</label>
        <input id="elKeyIn" type="password" placeholder="sk_..." />
        <label>Voice ID (optional)</label>
        <input id="elVoiceIn" type="text" placeholder="21m00Tcm4TlvDq8ikWAM (Rachel)" />
        <div class="btns">
          <button class="b-save">Save</button>
          <button class="b-test">Test 🔊</button>
          <button class="b-clear">Clear</button>
          <button class="b-close">Band karo</button>
        </div></div>`;
      document.body.appendChild(gear); document.body.appendChild(m);
      const keyIn=m.querySelector('#elKeyIn'), voiceIn=m.querySelector('#elVoiceIn');
      const open=()=>{ keyIn.value=elKey(); voiceIn.value=(localStorage.getItem('el_voice')||''); m.style.display='flex'; };
      const close=()=>{ m.style.display='none'; };
      gear.onclick=()=>{ primeTTS(); open(); };
      m.addEventListener('click',e=>{ if(e.target===m) close(); });
      m.querySelector('.b-save').onclick=()=>{ try{
        keyIn.value.trim() ? localStorage.setItem('el_key',keyIn.value.trim()) : localStorage.removeItem('el_key');
        voiceIn.value.trim() ? localStorage.setItem('el_voice',voiceIn.value.trim()) : localStorage.removeItem('el_voice');
        alert('Save ho gaya'+(keyIn.value.trim()?' — ab ElevenLabs voice chalegi':' — ab free browser voice chalegi')); close();
      }catch(e){ alert('Save nahi hua: '+e.message); } };
      m.querySelector('.b-test').onclick=()=>{ primeTTS();
        const k=keyIn.value.trim(); if(k){ try{localStorage.setItem('el_key',k);}catch(e){} if(voiceIn.value.trim()){try{localStorage.setItem('el_voice',voiceIn.value.trim());}catch(e){}} }
        speak('Namaste, ye ElevenLabs test hai. June mein 45 lakh ka outflow hai, dhanyawad.'); };
      m.querySelector('.b-clear').onclick=()=>{ try{localStorage.removeItem('el_key');localStorage.removeItem('el_voice');}catch(e){} keyIn.value=''; voiceIn.value=''; alert('Key hata di — ab free browser voice chalegi'); };
      m.querySelector('.b-close').onclick=close;
    }

    /* =============== 3) Voice (mic) =============== */
    function setupVoice(){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      const btn=document.createElement('button'); btn.id='voiceBtn'; btn.title='Tap: bolo · Long-press: chat panel';
      btn.setAttribute('aria-label','AI voice assistant');
      btn.innerHTML=`<span class="ai-rings"><span></span><span></span></span>`+
        `<svg class="ai-face" viewBox="0 0 48 48" aria-hidden="true">`+
        `<circle class="ai-eye l" cx="18" cy="19" r="3.4"/><circle class="ai-eye r" cx="30" cy="19" r="3.4"/>`+
        `<rect class="ai-bar" x="14.8" y="29" width="2.4" height="4.2" rx="1.2"/>`+
        `<rect class="ai-bar" x="19.8" y="29" width="2.4" height="4.2" rx="1.2"/>`+
        `<rect class="ai-bar" x="24.8" y="29" width="2.4" height="4.2" rx="1.2"/>`+
        `<rect class="ai-bar" x="29.8" y="29" width="2.4" height="4.2" rx="1.2"/></svg>`;
      const hint=document.createElement('div'); hint.id='voiceHint';
      document.body.appendChild(btn); document.body.appendChild(hint);
      const toast=(m,ms)=>{ hint.textContent=m; hint.style.display='block';
        clearTimeout(toast._t); if(ms) toast._t=setTimeout(()=>hint.style.display='none',ms); };
      if(!SR){ btn.style.opacity=.5; btn.onclick=()=>toast('Voice support nahi. Chrome use karo.',3500); return; }
      const rec=new SR(); rec.lang=VOICE_LANG; rec.interimResults=true; rec.continuous=false;
      let listening=false, finalText='';
      const stop=()=>{ try{ rec.stop(); }catch(e){} };

      async function runCommand(cmd){
        btn.classList.add('processing'); toast('▶ '+cmd+'  …kaam ho raha hai',4000);
        try{
          const r=await window.pageAgent.execute(cmd);          // background mein chalega
          btn.classList.remove('processing');
          const ans=(r && r.data) ? r.data : 'Ho gaya';
          toast('💬 '+ans, 6000);
          btn.classList.add('speaking');
          speak(ans);
          setTimeout(()=>{ btn.classList.remove('speaking'); }, 1500);
        }catch(e){
          btn.classList.remove('processing');
          toast('Error: '+(e&&e.message?e.message:'kuch galat hua'),4000);
        }
      }

      rec.onstart =()=>{ listening=true; btn.classList.add('listening'); toast('Sun raha hun… boliye'); };
      rec.onresult=(e)=>{ let it=''; finalText='';
        for(let i=0;i<e.results.length;i++){ const t=e.results[i][0].transcript; e.results[i].isFinal?finalText+=t:it+=t; }
        toast('🎤 '+(finalText||it)); };
      rec.onerror =(e)=>{ toast('Voice error: '+e.error,3000); };
      rec.onend   =()=>{
        listening=false; btn.classList.remove('listening');
        const cmd=finalText.trim();
        if(!cmd){ toast('Kuch sunai nahi diya',2500); return; }
        if(!window.pageAgent){ toast('AI ready ho raha hai, 2 sec ruk ke dobara bolo',3000); startAgent(); return; }
        if(window.pageAgent.status==='running'){ toast('Agent abhi busy hai',2500); return; }
        runCommand(cmd);
      };

      // tap = bolo / stop ;  long-press = chat panel toggle (jab type karna ho)
      let lp=null, longPressed=false;
      const startLP=()=>{ longPressed=false; lp=setTimeout(()=>{ longPressed=true; togglePanel(); }, 550); };
      const clearLP=()=>{ clearTimeout(lp); };
      function togglePanel(){
        if(!window.pageAgent){ toast('AI abhi ready nahi',2000); startAgent(); return; }
        const p=window.pageAgent.panel; const el=p && (p.element||p.root||p.container);
        // panel.show no-op kar diya tha (background); yahan seedha element toggle karte hain
        try{
          if(el){ const vis=getComputedStyle(el).display!=='none'; el.style.display=vis?'none':'block'; toast(vis?'Panel hidden':'Panel shown',1500); }
          else { p.hide(); toast('Panel toggle',1200); }
        }catch(e){ toast('Panel toggle nahi hua',1500); }
      }
      btn.addEventListener('touchstart',startLP,{passive:true});
      btn.addEventListener('touchend',clearLP);
      btn.addEventListener('mousedown',startLP);
      btn.addEventListener('mouseup',clearLP);
      btn.onclick=()=>{ if(longPressed){ longPressed=false; return; } primeTTS(); listening ? stop() : (finalText='', rec.start()); };
    }

    /* =============== kickoff =============== */
    setupVoice();                          // mic turant dikh jaye
    setupSettings();                       // ⚙️ gear (ElevenLabs key 1-time)
    whenDashboardReady(startAgent);        // agent sirf data aane ke BAAD
  })();
  </script>

</body>
</html>
